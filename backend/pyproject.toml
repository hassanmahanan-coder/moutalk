[project]
name = "moutalk-backend"
version = "0.1.0"
description = "谋谈 MouTalk - 多轮深度谈判模拟 Agent 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=1.2.11",
    "langchain-openai>=1.5.1",
    "langchain>=1.3.15",
    "langfuse>=4",
    "langgraph-checkpoint-postgres>=3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "pymilvus>=2.4",
    "milvus-lite>=2.4",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "alipay-sdk-python>=3.3",
    "alembic>=1.14",
    "matplotlib>=3.10",
    "reportlab>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.ignore = ["B008"]  # FastAPI Depends 默认参数模式
